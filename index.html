<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>База знаний УОиИ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --graphite:#29303E; --purple:#951B81; --grad:linear-gradient(90deg,#831F82 0%,#C7017F 60%,#E30613 100%);
  --bg:#F4F5F9; --surface:#FFFFFF; --text:#29303E; --muted:#6A7080; --line:#DFE2EA;
  --tile:#29303E; --tile-text:#FFFFFF; --tile-muted:#B5BAC7; --accent:#951B81;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B2029; --surface:#252B38; --text:#F1F2F6; --muted:#9EA4B4; --line:#363D4D;
    --tile:#2F3747; --tile-text:#FFFFFF; --tile-muted:#B5BAC7; --accent:#E04DC4; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B2029; --surface:#252B38; --text:#F1F2F6; --muted:#9EA4B4; --line:#363D4D;
  --tile:#2F3747; --tile-text:#FFFFFF; --tile-muted:#B5BAC7; --accent:#E04DC4; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Montserrat","Segoe UI",Arial,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
header{background:#fff;border-bottom:1px solid #E5E7EE;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{max-width:1040px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:block;height:26px;width:auto}
.bar nav{display:flex;gap:6px;flex-wrap:wrap}
.bar nav a{font-size:14px;font-weight:600;color:#29303E;padding:8px 12px;border-radius:10px}
.bar nav a:hover{background:#F1E6EF;color:#951B81}
.bar nav a[aria-current="page"]{color:#951B81;background:#F6EAF4}
.stripe{height:4px;background:var(--grad)}
main{max-width:1040px;margin:0 auto;padding:36px 20px 64px}
.view{display:none}.view.on{display:block}
h1{font-size:clamp(28px,5vw,44px);line-height:1.15;font-weight:700;margin:0 0 10px;letter-spacing:-.01em}
.lead{font-size:clamp(16px,2.4vw,20px);color:var(--muted);margin:0 0 28px;max-width:34em}
.rule{height:6px;width:120px;border-radius:3px;background:var(--grad);margin:0 0 28px}
.crumbs{font-size:14px;color:var(--muted);margin:0 0 18px}
.crumbs a{color:var(--accent);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-bottom:34px}
.tile{display:flex;flex-direction:column;justify-content:space-between;min-height:190px;padding:26px;border-radius:20px;background:var(--tile);color:var(--tile-text);position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--grad)}
.tile h2{font-size:26px;line-height:1.2;margin:8px 0 6px;font-weight:700}
.tile p{margin:0;color:var(--tile-muted);font-size:15px}
.tile .go{font-weight:600;font-size:15px;margin-top:18px}
.tile:hover{filter:brightness(1.12)}
h3{font-size:20px;margin:0 0 14px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--purple);border-radius:14px;padding:18px 20px;min-height:104px}
.card b{font-size:17px;line-height:1.3;font-weight:600}
.card small{color:var(--muted);font-size:13px}
a.card:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(41,48,62,.12)}
.card.off{border-left-color:var(--line);background:transparent;border-style:dashed}
.card.off b{color:var(--muted)}
.sec{margin-top:8px}
footer{max-width:1040px;margin:0 auto;padding:0 20px 36px;color:var(--muted);font-size:13px}
@media (max-width:640px){.bar{flex-direction:column;align-items:flex-start;gap:8px}.bar nav{margin-left:-12px}main{padding-top:26px}}
</style>
</head>

<script>
var D={
 mortgage:{title:'Отдел ипотеки',parent:null,items:[
  ['Памятка Банки 3.0','https://mikhailshevelev-dotcom.github.io/strana-bank-memo/'],
  ['Таблица Банки 3.0','https://docs.google.com/spreadsheets/d/1BIwMWMBAB7LR9MbR5qGrIXYbq_LdFshCPz1Q_l-Mqcs/edit?gid=1749938485'],
  ['Проверка КИ','https://strana-development.github.io/credit_history/'],
  ['Документы для подачи на ипотеку','https://strana-development.github.io/Pamyatka-ipoteka/'],
  ['Структура отдела','#structure-mortgage']]},
 registration:{title:'Отдел оформления',parent:null,items:[
  ['Памятка по документам','https://strana-development.github.io/Pamyatka/'],
  ['Регламенты','#regulations','Отдельный раздел'],
  ['Учет оформления','#accounting','Отдельный раздел'],
  ['График отдела оформления','https://mikhailshevelev-dotcom.github.io/grafik/'],
  ['Структура отдела','#structure-registration'],
  ['Вопрос-ответ по ДДУ/ДКП','https://mikhailshevelev-dotcom.github.io/vopros-otvet/']]},
 links:{title:'Полезные ссылки',parent:null,items:[
  ['Заказ справок','https://docs.google.com/spreadsheets/d/1xrbBarrAbEVRuFYjcXYfHgsAPSqUVI2VMcxV7rdGEPE/edit?gid=0'],
  ['Список УК','https://docs.google.com/spreadsheets/d/15ZzxWriD-l2V06Cs-KMveKuLGVDXs1WQI8yL9v28FOA/edit?gid=0'],
  ['Регламент скидок','https://docs.google.com/spreadsheets/d/1sIW5P9u1WG-k0qkr_V-DyNfEPC388e7Kuqex1dnRGBE/edit?gid=1656956659']]},
 regulations:{title:'Регламенты',parent:'registration',items:[
  ['Возврат на бронь','https://teamly.itstrana.site/at/0b5dd42c-34ba-4c8d-9324-b29d1e7ee7c0'],
  ['Возврат на доработку','https://teamly.itstrana.site/at/82ce8c3a-9813-4d8a-8a93-ff77f6f1bee1'],
  ['Заполнение АМО','https://teamly.itstrana.site/at/a6a438a8-1176-4f7a-9384-adad56bc26ef'],
  ['Презентация: заполнение АМО','https://docs.google.com/presentation/d/12nrCBmMbdxOAS63hOAZMM8v0PjYYNdm6l_78SYJfDz0/edit?slide=id.g3f408a661f2_2_60']]},
 accounting:{title:'Учет оформления',parent:'registration',items:[
  ['Основной учет','https://docs.google.com/spreadsheets/d/1fGjK5aUejwzZxgjP_c1QiHygBblGHj0C_YU15O7CEJs/edit?gid=1853423590'],
  ['Сделки по ЖК','https://docs.google.com/spreadsheets/d/1THBztpODsY_sSu4OeheFK9KnCNOJZg-ScIaR1iwGSq8/edit?gid=64920082']]}
};
var NAV=[['home','Главная'],['mortgage','Отдел ипотеки'],['registration','Отдел оформления'],['links','Полезные ссылки']];
function kind(u){
  if(!u)return 'Раздел скоро появится';
  if(u.charAt(0)=='#')return 'Отдельный раздел';
  if(u.indexOf('docs.google.com/spreadsheets')>-1)return 'Google Таблица';
  if(u.indexOf('docs.google.com/presentation')>-1)return 'Google Презентация';
  if(u.indexOf('teamly')>-1)return 'Регламент в Teamly';
  return 'Веб-страница';
}
function card(it){
  var u=it[1],k=kind(u);
  if(u=='#structure-mortgage'||u=='#structure-registration')k='Структура отдела';
  if(!u)return '<div class="card off"><b>'+it[0]+'</b><small>'+k+'</small></div>';
  var ext=u.charAt(0)!='#';
  return '<a class="card" href="'+u+'"'+(ext?' target="_blank" rel="noopener noreferrer"':'')+'><b>'+it[0]+'</b><small>'+k+'</small></a>';
}
function plural(n){var m=n%10,h=n%100;return n+(m==1&&h!=11?' материал':(m>1&&m<5&&(h<10||h>20)?' материала':' материалов'))}
function structurePage(id){
  var parent=id=='structure-mortgage'?'mortgage':'registration';
  return '<p class="crumbs"><a href="#'+parent+'">← Назад</a></p><h1>Структура отдела</h1><div class="rule"></div><div style="height:calc(100vh - 250px);min-height:520px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden"><iframe title="Структура отдела" src="https://github.com/mikhailshevelev-dotcom/struktura-otdela" style="width:100%;height:100%;border:0" loading="lazy"></iframe></div><p class="crumbs" style="margin-top:16px"><a href="#'+parent+'">← Назад к разделу</a></p>';
}
function page(id){
  var d=D[id];
  var crumbs=d.parent?'<p class="crumbs"><a href="#'+d.parent+'">'+D[d.parent].title+'</a> / '+d.title+'</p>':'<p class="crumbs"><a href="#home">Главная</a> / '+d.title+'</p>';
  return crumbs+'<h1>'+d.title+'</h1><div class="rule"></div><div class="grid">'+d.items.map(card).join('')+'</div>';
}
function home(){
  return '<h1>База знаний Управления Оформления и Ипотеки</h1><p class="lead">Для отделов продаж.</p><div class="rule"></div>'+
  '<div class="tiles">'+
  ['mortgage','registration'].map(function(k){var d=D[k];return '<a class="tile" href="#'+k+'"><div><h2>'+d.title+'</h2><p>'+plural(d.items.length)+'</p></div><span class="go">Открыть раздел</span></a>'}).join('')+
  '</div><div class="sec"><h3>Полезные ссылки</h3><div class="grid">'+D.links.items.map(card).join('')+'</div></div>';
}
function route(){
  var id=(location.hash||'#home').slice(1);
  if(id!='home'&&!D[id]&&id!='structure-mortgage'&&id!='structure-registration')id='home';
  document.getElementById('app').innerHTML=id=='home'?home():(id.indexOf('structure-')===0?structurePage(id):page(id));
  var top=D[id]&&D[id].parent?D[id].parent:(id.indexOf('structure-')===0?id.replace('structure-',''):id);
  document.getElementById('nav').innerHTML=NAV.map(function(n){return '<a href="#'+n[0]+'"'+(n[0]==top?' aria-current="page"':'')+'>'+n[1]+'</a>'}).join('');
  document.title=(id=='home'?'':D[id].title+' — ')+'База знаний УОиИ';
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);route();
